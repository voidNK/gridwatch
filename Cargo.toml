[package]
name = "gridwatch"
version = "0.10.4"
edition = "2024"
license-file = "LICENSE"
description = "Desktop dashboard that watches Linux and macOS machines over SSH"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
directories = "6.0.0"
eframe = "0.37.0"
egui_extras = { version = "0.37", default-features = false }
egui_plot = "0.38.0"
flate2 = "1.1.11"
image = { version = "0.25.10", default-features = false, features = ["png"] }
keyring = { version = "4.2.0", features = ["apple-native-keyring-store"] }
notify-rust = "4.19.0"
rodio = { version = "0.23.0", default-features = false, features = ["playback"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
russh = { version = "0.65.2", default-features = false, features = ["ring", "flate2", "rsa"] }
self-replace = "1.5.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
ureq = "3.5.2"
zip = { version = "9.6.1", default-features = false, features = ["deflate"] }

[target."cfg(windows)".dependencies]
sysinfo = "0.40.4"
windows-registry = "0.100.0"

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = "0.26.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSResponder", "std"] }
