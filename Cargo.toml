[package]
name = "gridwatch"
version = "0.1.0"
edition = "2024"
description = "Desktop dashboard that monitors Linux servers over SSH"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
directories = "6.0.0"
eframe = "0.37.0"
egui_plot = "0.38.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
notify-rust = "4.19.0"
rodio = { version = "0.23.0", default-features = false, features = ["playback"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
russh = { version = "0.65.2", default-features = false, features = ["ring", "flate2", "rsa"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
