name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      # The installers are built here as well, so a broken packaging script shows up
      # before a release is tagged. They can be downloaded from the run for a try-out.
      - name: Installer (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          sh packaging/macos/package.sh target/release/gridwatch "$version" macos-arm64 dist

      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersion=$version" "/DProgram=$((Resolve-Path target\release\gridwatch.exe).Path)" packaging\windows\gridwatch.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        if: runner.os != 'Linux'
        with:
          name: installer-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*-setup.exe
          if-no-files-found: error
          retention-days: 7
