name: Release

# Push a tag like v0.3.0 to build gridwatch for every platform and publish a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          # An older Ubuntu so the binary also starts on distributions with an older glibc.
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the version in Cargo.toml
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Every platform gets an archive the built-in updater reads; Windows and macOS
      # also get an installer for people.
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          name="gridwatch-$GITHUB_REF_NAME-${{ matrix.name }}"
          mkdir -p dist "$name"
          cp README.md CHANGELOG.md LICENSE "target/${{ matrix.target }}/release/gridwatch" "$name/"
          tar -czf "dist/$name.tar.gz" "$name"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          sh packaging/macos/package.sh "target/${{ matrix.target }}/release/gridwatch" "${GITHUB_REF_NAME#v}" "${{ matrix.name }}" dist

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $program = "target\${{ matrix.target }}\release\gridwatch.exe"
          $name = "gridwatch-$env:GITHUB_REF_NAME-${{ matrix.name }}"
          New-Item -ItemType Directory -Force dist, $name | Out-Null
          Copy-Item README.md, CHANGELOG.md, LICENSE, $program $name
          Compress-Archive -Path $name -DestinationPath "dist\$name.zip"
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersion=$version" "/DProgram=$((Resolve-Path $program).Path)" packaging\windows\gridwatch.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Take the notes for this version from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## /{ printing = ($2 == v); next } printing' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "gridwatch $GITHUB_REF_NAME" --notes-file notes.md
